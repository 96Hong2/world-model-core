# Golden 20문항 (Phase 1A)
#
# 기대값의 근거는 **자료 원문**이다. 시스템 출력에서 복사한 값은 한 건도 없다
# (이 파일을 쓴 시점에 답변 API 는 존재하지 않는다).
#
# 각 must_include·conflict.sides 는 `verify` 블록을 갖는다. tests/test_eval_harness.py 의
# test_golden_quotes_exist_in_sources 가 원본 파일(xlsx 셀 / 추출 txt / slack jsonl)을 직접 열어
# source_quote 가 실제로 그 자리에 있는지 검사한다. 이 테스트가 기대값 날조를 막는 장치다.
#
# 필드
#   id / type / question / expected_route / expected_evidence_min
#   must_include[]        {fact, source_quote, source_file, locator, verify}
#     fact         : 답변 본문(answer.text + recommendation + estimated_parts + unknowns + gaps.basis.reason)에
#                    반드시 나타나야 하는 문자열
#     source_quote : 원문 그대로의 발췌. evidence.snippet 안에 이 문자열이 있어야 한다
#     locator      : sheet!A12 / p.N / slide N / slack:{channel}/{ts}
#   must_not_include[]    답변 어디에도 나오면 안 되는 문자열
#   conflict              양측 병렬 제시를 요구하는 문항 전용
#   expected_gap_verdict  gap 판정 문항 전용 (+ gap_subject_contains / forbidden_gap_verdicts /
#                         require_out_of_scope_by_design)
#   traceability_allow[]  집계로 산출되어 원문에 그 형태로는 없는 값. 각각 notes 에 근거를 적는다
#   notes                 왜 이 기대값인가

version: "1.0.0"
question_count: 20

# 자료 절대경로 별칭 (verify 블록에서 참조)
paths:
  wiki: data/sources/wiki
  text: ./data/raw_probe/text
  slack: ./data/sources/slack

questions:
  # ======================================================================
  # 데모 최우선 5개 (GQ-D1 ~ GQ-D5)
  # ======================================================================
  - id: GQ-D1
    type: strategic
    question: 가나손해보험에게 어떤 Sales Point를 잡는 것이 좋은가?
    expected_route: Q-S
    expected_evidence_min: 2
    must_include:
      - fact: "2.85억"
        source_quote: "2.85억"
        source_file: "{wiki}/영업본부_방문 및 접촉 활동 일지.xlsx"
        locator: "6월15일(월)!H39"
        verify: { kind: xlsx, sheet: "6월15일(월)", cell: H39 }
      - fact: "금액 점수 격차"
        source_quote: "최종 우선협상대상자 선정을 위한 핵심 걸림돌(금액 점수 격차)이 확인"
        source_file: "{wiki}/영업본부_방문 및 접촉 활동 일지.xlsx"
        locator: "6월15일(월)!J39"
        verify: { kind: xlsx, sheet: "6월15일(월)", cell: J39 }
      - fact: "유지보수"
        source_quote: "대응 방안 및 유지보수 기준 조정을 요청 받음"
        source_file: "{wiki}/영업본부_방문 및 접촉 활동 일지.xlsx"
        locator: "6월15일(월)!J39"
        verify: { kind: xlsx, sheet: "6월15일(월)", cell: J39 }
      - fact: "제안"
        source_quote: "- 사업제안 진행중 / 6.4 제안발표 예정"
        source_file: "{wiki}/영업본부_방문 및 접촉 활동 일지.xlsx"
        locator: "홍길동!J10"
        verify: { kind: xlsx, sheet: "홍길동", cell: J10 }
    must_not_include:
      - "수주 완료"
      - "계약 체결됨"
    notes: >-
      §9 가 지정한 근거("제안 2.85억 · 금액 점수 격차")는 활동일지 6월15일(월) 시트 39행에 실재한다.
      금액 점수가 걸림돌이라는 사실이 원문에 있으므로 Sales Point 는 가격이 아니라 유지보수 기준·범위
      조정 쪽으로 잡아야 한다는 것이 답의 뼈대다. 승패를 단정하는 표현은 원문에 없으므로 금지한다.
      ⚠️ config/sources.yaml 의 sales_activity_log scope 는 일일보고 최신 2장만 포함하는데
      그 2장(6월30일·7월1일)의 5번 섹션은 데이터 0행이라 2.85억 근거가 ingest 되지 않는다.
      기대값은 원문 기준으로 두고 scope 는 Lead 가 조정해야 한다(최종 보고에 기재).

  - id: GQ-D2
    type: strategic
    question: 현재 회사가 개척하려는 Business Domain들은 무엇이고 각각 어느 단계인가?
    expected_route: Q-S
    expected_evidence_min: 3
    must_include:
      - fact: "보험설계지원"
        source_quote: "보험설계지원"
        source_file: "{wiki}/BD Overview.xlsx"
        locator: "기대효과!B4"
        verify: { kind: xlsx, sheet: "기대효과", cell: B4 }
      - fact: "신용평가"
        source_quote: "신용평가"
        source_file: "{wiki}/BD Overview.xlsx"
        locator: "기대효과!I4"
        verify: { kind: xlsx, sheet: "기대효과", cell: I4 }
      - fact: "프랜차이즈"
        source_quote: "프랜차이즈"
        source_file: "{wiki}/BD Overview.xlsx"
        locator: "기대효과!P4"
        verify: { kind: xlsx, sheet: "기대효과", cell: P4 }
      - fact: "제외"
        source_quote: "제외"
        source_file: "{wiki}/BD Overview.xlsx"
        locator: "진척도!E16"
        verify: { kind: xlsx, sheet: "진척도", cell: E16 }
      - fact: "세일즈킷"
        source_quote: "세일즈킷\n완성"
        source_file: "{wiki}/BD Overview.xlsx"
        locator: "진척도!D2"
        verify: { kind: xlsx, sheet: "진척도", cell: D2 }
    must_not_include:
      - "모든 BD가 동일한 단계"
    notes: >-
      단계의 정본은 두 시트다. 관리/후보/제외 구분은 기대효과 시트의 가로 3블록(B2 관리 BM ·
      I2 후보 BM · P2 제외 BM)이고, 준비 진척은 진척도 시트의 6개 열이다.
      기대효과 시트는 행 순회로는 후보/제외 블록을 못 읽는 가로 배치라, 이 문항이 파서 결함을 그대로 드러낸다.

  - id: GQ-D3
    type: gap
    question: B2B 유통 Sales 영역에서 우리 제품이 해결할 수 있는 문제와 부족한 Capability는 무엇인가?
    expected_route: Q-S
    expected_evidence_min: 3
    expected_gap_verdict: POSSIBLE
    gap_subject_contains: "B2B"
    must_include:
      - fact: "견적/발주"
        source_quote: "견적/발주 응대 및 업무 소통"
        source_file: "{wiki}/BD Overview.xlsx"
        locator: "BM 정의!H15"
        verify: { kind: xlsx, sheet: "BM 정의", cell: H15 }
      - fact: "유통대리점"
        source_quote: "유통대리점/고객"
        source_file: "{wiki}/BD Overview.xlsx"
        locator: "BM 정의!G15"
        verify: { kind: xlsx, sheet: "BM 정의", cell: G15 }
      - fact: "개인 카톡"
        source_quote: "업무 대화가 개인 카톡에 산재해 회사가 관리·통제 못 함"
        source_file: "{wiki}/고객사 Pain Point·구축 대응 통합 관리.xlsx"
        locator: "Pain Point 목록!E2"
        verify: { kind: xlsx, sheet: "Pain Point 목록", cell: E2 }
      - fact: "iPhone"
        source_quote: "iPhone 등에서 거래처가 카카오 대화방 -> 상담톡으로 파일 전달 못함"
        source_file: "{wiki}/고객사 Pain Point·구축 대응 통합 관리.xlsx"
        locator: "Pain Point 목록!E4"
        verify: { kind: xlsx, sheet: "Pain Point 목록", cell: E4 }
    must_not_include:
      - "기능이 없습니다"
      - "지원하지 않습니다"
    notes: >-
      해결 가능한 문제는 카파전선(제조·전선) 구축 사례 15건이 실증한다. 부족한 Capability 쪽은
      B2B유통/세일즈 BD 전체를 대표할 구축 근거가 카파전선 1개 고객사뿐이라 POSSIBLE 이 상한이다.
      Need 근거는 강하지만 "무엇이 없다"는 명시적 진술은 어떤 자료에도 없으므로 CONFIRMED 로 올릴 수 없다.

  - id: GQ-D4
    type: multihop
    question: 여러 Business Domain에서 공통적으로 등장하는 Need는 무엇인가?
    expected_route: Q-M
    expected_evidence_min: 4
    must_include:
      - fact: "카파전선"
        source_quote: "업무 대화가 개인 카톡에 산재해 회사가 관리·통제 못 함"
        source_file: "{wiki}/고객사 Pain Point·구축 대응 통합 관리.xlsx"
        locator: "Pain Point 목록!E2"
        verify: { kind: xlsx, sheet: "Pain Point 목록", cell: E2 }
      - fact: "마바손해보험"
        source_quote: "매니저 개인 카톡이라 회사가 소통 공간을 들여다볼 수 없음"
        source_file: "{wiki}/고객사 Pain Point·구축 대응 통합 관리.xlsx"
        locator: "Pain Point 목록!E19"
        verify: { kind: xlsx, sheet: "Pain Point 목록", cell: E19 }
      - fact: "사아캐피탈"
        source_quote: "매니저 개인 카톡 오픈채팅이라 회사가 소통공간을 통제 못함"
        source_file: "{wiki}/고객사 Pain Point·구축 대응 통합 관리.xlsx"
        locator: "Pain Point 목록!E53"
        verify: { kind: xlsx, sheet: "Pain Point 목록", cell: E53 }
      - fact: "타하렌터카"
        source_quote: "영업 소통이 개인폰·개인카톡에 산재해 통화·문자·고객정보를 회사가 관리 못 함"
        source_file: "{wiki}/고객사 Pain Point·구축 대응 통합 관리.xlsx"
        locator: "Pain Point 목록!E82"
        verify: { kind: xlsx, sheet: "Pain Point 목록", cell: E82 }
    must_not_include:
      - "한 고객사에서만"
    notes: >-
      표현이 4가지("개인 카톡에 산재" / "매니저 개인 카톡" / "개인 카톡 오픈채팅" / "개인폰·개인카톡")로
      흩어져 있고 고객사도 산업이 전부 다르다(전선 제조 · 손보 · 캐피탈 · 렌터카).
      canonical Need 하나(need.channel_control_absent)로 묶이지 않으면 이 문항은 성립하지 않는다.
      네 고객사 이름이 모두 나와야 "여러 BD"라는 답의 근거가 선다.

  - id: GQ-D5
    type: strategic
    question: 어떤 Capability가 여러 산업으로 확장될 가능성이 높은가?
    expected_route: Q-S
    expected_evidence_min: 3
    must_include:
      - fact: "기업 공식 소통 채널"
        source_quote: "기업 공식 소통 채널"
        source_file: "{wiki}/고객사 Pain Point·구축 대응 통합 관리.xlsx"
        locator: "Pain Point 목록!D2"
        verify: { kind: xlsx, sheet: "Pain Point 목록", cell: D2 }
      - fact: "기업 공식 영업 채널"
        source_quote: "기업 공식 영업 채널(법인폰·카카오 상담톡)"
        source_file: "{wiki}/고객사 Pain Point·구축 대응 통합 관리.xlsx"
        locator: "Pain Point 목록!D82"
        verify: { kind: xlsx, sheet: "Pain Point 목록", cell: D82 }
      - fact: "카카오 알림톡"
        source_quote: "카카오 알림톡/로그인 연동 인프라"
        source_file: "{wiki}/고객사 Pain Point·구축 대응 통합 관리.xlsx"
        locator: "Pain Point 목록!D63"
        verify: { kind: xlsx, sheet: "Pain Point 목록", cell: D63 }
      - fact: "보험사"
        source_quote: "공통 : 보험설계지원, TM, CS, 채권추심(구상권), 퇴직연금(일부)"
        source_file: "{wiki}/BD Overview.xlsx"
        locator: "멀티BM!C3"
        verify: { kind: xlsx, sheet: "멀티BM", cell: C3 }
    must_not_include:
      - "모든 Capability가 동일하게"
    traceability_allow: []
    notes: >-
      "공식 채널·연동 기반" 분류는 pain 95건 중 16건으로 최다이고, 구축 고객 4사(전선 제조 · 손보 ·
      캐피탈 · 렌터카) 전부에 나타난다. 산업이 전부 다른데 같은 Capability 계열이 반복된다는 것이
      확장 가능성의 근거다. 멀티BM 시트는 한 산업이 여러 BD 를 동시에 필요로 한다는 별도 축의 근거다.

  # ======================================================================
  # 게이트 시연 3개 (GQ-D6 ~ GQ-D8)
  # ======================================================================
  - id: GQ-D6
    type: rare_critical
    question: 하늘IT와 구독 사업을 추진하려면 반드시 해결해야 할 기술 전제는 무엇인가?
    expected_route: Q-E
    expected_evidence_min: 1
    must_include:
      - fact: "멀티테넌트"
        source_quote: "멀티테넌트 구조 개발 필요 (Saas로 이야기되었는데 이 부분 검토 후 협의 필요)"
        source_file: "{wiki}/하늘IT 협업 관련 검토 사항.pdf"
        locator: "p.2"
        verify:
          { kind: text, path: "{text}/하늘IT 협업 관련 검토 사항.pdf.txt" }
      - fact: "유저 라이선스"
        source_quote: "개발 필요 : 유저 라이선스 구조 등 고려하면 범위가 작진 않음."
        source_file: "{wiki}/하늘IT 협업 관련 검토 사항.pdf"
        locator: "p.2"
        verify:
          { kind: text, path: "{text}/하늘IT 협업 관련 검토 사항.pdf.txt" }
      - fact: "한서버"
        source_quote: "현 구조 (교보+오로라소프트 한서버에서 멀티 고객"
        source_file: "{wiki}/하늘IT 협업 관련 검토 사항.pdf"
        locator: "p.2"
        verify:
          { kind: text, path: "{text}/하늘IT 협업 관련 검토 사항.pdf.txt" }
    must_not_include:
      - "이미 지원"
      - "이미 제공"
      - "이미 갖추"
    notes: >-
      이 사실은 문서 23종 중 이 파일 한 곳에만 있다(1회 등장). 반대로 온보딩 문서는 제품을
      "엔터프라이즈 멀티테넌시 애플리케이션 · 센터(Center) 기반 데이터 격리"로 소개해서,
      단순 키워드 검색이면 그쪽이 먼저 잡혀 "이미 지원한다"는 틀린 답이 나온다.
      must_not_include 3종이 그 오답을 잡는 장치다. Graph 에 반영되지 않았더라도
      Evidence fulltext top-K("추가 원문 근거")로는 반드시 노출돼야 한다(Gate 1A 항목 4).

  - id: GQ-D7
    type: conflict
    question: 개인 메신저를 업무에 쓴 미국 금융권에 부과된 벌금 규모는 얼마인가?
    expected_route: Q-E
    expected_evidence_min: 2
    must_include:
      - fact: "미국"
        source_quote: "미국 금융권 부과된 벌금 180M 달러"
        source_file: "{wiki}/오로라웍스_보험설계지원_솔루션_바다손해보험_제안.html"
        locator: "업무 개선점 > 개인정보 이슈"
        verify:
          {
            kind: text,
            path: "{text}/오로라웍스_보험설계지원_솔루션_바다손해보험_제안.html.txt",
          }
    must_not_include:
      - "정확한 금액은 180M 달러입니다"
      - "정확한 금액은 18억 달러입니다"
    conflict:
      subject: 미국 금융권 개인 메신저 사용 벌금 규모
      sides:
        - value: "180M 달러"
          source_quote: "상시 보안 리스크 노출 · 정보 관리 개인 의존 (미국 금융권 부과된 벌금 180M 달러 - 한화 약 2,564억 원)"
          source_file: "{wiki}/오로라웍스_보험설계지원_솔루션_바다손해보험_제안.html"
          locator: "업무 개선점 > 개인정보 이슈"
          verify:
            {
              kind: text,
              path: "{text}/오로라웍스_보험설계지원_솔루션_바다손해보험_제안.html.txt",
            }
        - value: "18억 달러"
          source_quote: "18억 달러 (약 2조 5,668억) 벌금 부과"
          source_file: "{wiki}/[오로라소프트] B2B2C를 연결하는 연금 비즈니스 공식 채널 소개서_V2.0.pptx"
          locator: "slide 14"
          verify:
            {
              kind: text,
