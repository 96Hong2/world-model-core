# Alias 사전 초판 (A0 확정)
#
# 원칙 (v1.0 §D-5 / REVISED §4 ④)
#   1. 정규화 후 exact match 만 한다. 부분 문자열·유사도 자동 병합은 코드에 경로 자체를 만들지 않는다.
#   2. 사전 미스는 신규 Entity 로 두고 기록만 한다. SAME_AS 후보 큐와 승인 CLI 는 1B(B4).
#   3. 접두어가 같아도 다른 법인이면 절대 묶지 않는다. do_not_merge 가 그 목록이다.
#   4. 오타로 보이는 표기는 alias 로 넣지 않는다. review_queue_seed 로 보내 사람이 판단한다.
#
# 실측 출처
#   accounts   : 활동일지 3계층 + 주간계획 5.·6. 표 + pain 3시트 = 원문 표기 129종
#                Slack 4채널(#리드등록알림 118종, #all-영업활동공유 제목 첫 토큰 196종)
#   product_terms : docs/glossary.md 104행 → data/raw_probe/glossary-pairs.tsv
#   competitors / partners : [자차캐피탈] TABLE 5, BD Overview 진척도 H열, 하늘IT 검토 문서

version: "1.0.0"

normalize:
  steps:
    - "NFKC 정규화"
    - "앞뒤 공백 제거, 연속 공백 1칸으로 축약"
    - "법인 접두·접미 제거: (주), ㈜, 주식회사, (株), Inc., Inc, Co., Ltd."
    - "괄호 주석 분리: '(기회 미생성)'·'(보험설계지원/자동차보상)' 같은 상태·BD 주석은 이름에서 떼어 별도 필드로"
  note: >-
    정규화는 매칭 키를 만들 때만 쓰고, Evidence 와 raw_names 에는 원문 표기를 그대로 보존한다.

# ==========================================================================
# 1. 고객사 (Account)
# ==========================================================================
accounts:
  # --- 활동일지·주간계획 내부의 표기 변형 (xlsx 실측) ---
  - canonical: 가나은행
    variants: [가나은행]
    basis: "주간계획 5.·6. 표는 '가나은행', 활동일지 날짜별 시트·일일보고 2.는 '가나은행'. 같은 은행."
    seen_in:
      [
        "활동일지!7월13일~16일",
        "활동일지!7월6일~10일",
        "활동일지!일일보고(2.)",
        "주간계획!5.",
        "주간계획!6.",
        "활동일지!홍길동",
      ]

  - canonical: 두리생명
    variants: [두리생명]
    basis: "접미사 축약. 주간계획 6.은 '두리생명', 활동일지 홍길동 시트는 '두리생명'."

  - canonical: 나래생명
    variants: [나래생명]
    basis: "접미사 축약. 슬랙 증분 0812 의 #all-영업활동공유 제목은 '나래생명', 기존 그래프 계정은 '나래생명'. 같은 법인(두 생명보험사의 통합사)."

  - canonical: 누리손해보험
    variants: [누리손해보험]
    basis: "NH 접두 유무 차이. 활동일지 일일보고 5.는 '누리손해보험', 일일보고 2.·이영희 시트는 '누리손해보험'."
    caution: "'누리생명보험'(박민수 시트)은 다른 법인이다. do_not_merge 참조."

  - canonical: 모다패션
    variants: [모다패션]
    basis: "일일보고 5. 는 '모다패션 / 제안 / 1.9억 / 0.25', 주간계획 5.·6.과 활동일지 홍길동·7월6일~10일은 '모다패션'. 같은 딜(RFP 결과 발표가 모다패션 내부 결재 일정으로 연기)."

  - canonical: 두루쇼핑
    variants: ["두루쇼핑(기회 미생성)"]
    basis: "괄호는 SFDC 기회 생성 여부 주석이지 회사명의 일부가 아니다."
    parenthetical_field: sfdc_note

  - canonical: 하늘문고
    variants: ["하늘문고(기회 미생성)"]
    basis: "위와 같음."
    parenthetical_field: sfdc_note

  - canonical: 미르손해보험
    variants: ["미르손해보험 (보험설계지원/자동차보상)"]
    basis: "괄호는 그 행의 BD 주석이다. 일일보고 6.에서만 붙는다."
    parenthetical_field: bd_note

  - canonical: 다라카드
    variants: []
    split_into_deals:
      - {
          deal_scope: 자동차,
          raw: "다라카드 자동차",
          seen_in: "활동일지!일일보고(5.)",
        }
      - {
          deal_scope: 채권,
          raw: "다라카드 채권",
          seen_in: "활동일지!일일보고(5.)",
        }
    basis: >-
      같은 고객사의 다른 딜(부서)이다. Account 3개가 아니라 Account 1개 + Deal 2개로 분해한다.
      바다손해보험 제안서의 확산 경로 기술과도 일치한다(고객센터 → 온라인영업팀·마이카플랫폼팀·금융기획팀 → 채권기획팀 → 심사발급팀).

  # --- Slack 실측 표기 변형 (법인 접두·접미) ---
  - {
      canonical: 늘품통상,
      variants: ["늘품통상(주)", 늘품통상주식회사],
      basis: "법인 접미 표기 차이",
      seen_in: ["slack!리드등록알림"],
    }
  - {
      canonical: 다솜텔레콤,
      variants: ["다솜텔레콤(주)"],
      basis: "법인 접미 표기 차이",
      seen_in: ["slack!리드등록알림"],
    }
  - {
      canonical: 메디온에이아이,
      variants: ["메디온 AI", "메디온에이아이(주)"],
      basis: "한글 음차와 영문 약칭 혼용 + 법인 접미",
      seen_in: ["slack!리드등록알림"],
    }
  - {
      canonical: 누리페이,
      variants: ["(주)누리페이", "주식회사 누리페이"],
      basis: "법인 접두 표기 차이",
      seen_in: ["slack!리드등록알림"],
    }
  - {
      canonical: 드림런,
      variants: ["(주)드림런", "주식회사 드림런"],
      basis: "법인 접두 표기 차이",
      seen_in: ["slack!리드등록알림"],
    }
  - {
      canonical: 미리내컴즈,
      variants: ["(주)미리내컴즈", "주식회사 미리내컴즈"],
      basis: "법인 접두 표기 차이",
      seen_in: ["slack!리드등록알림"],
    }
  - {
      canonical: 리듬컴퍼니,
      variants: ["(주)리듬컴퍼니"],
      basis: "법인 접두 표기 차이",
      seen_in: ["slack!리드등록알림"],
    }
  - {
      canonical: 우산보험중개,
      variants: ["(주)우산보험중개"],
      basis: "법인 접두 표기 차이",
      seen_in: ["slack!리드등록알림"],
    }
  - {
      canonical: 미르에버텍,
      variants: ["주식회사 미르에버텍"],
      basis: "법인 접두 표기 차이",
      seen_in: ["slack!리드등록알림"],
    }
  - {
      canonical: 하람글로벌,
      variants: ["㈜하람글로벌", "주식회사 하람글로벌"],
      basis: "법인 접두 표기 차이",
      seen_in: ["slack!리드등록알림"],
    }
  - {
      canonical: 인디고코리아,
      variants: ["인디고코리아"],
      basis: "영문 상호와 한글 음차. 활동일지 박민수 시트에도 '인디고코리아'로 등장",
      seen_in:
        ["slack!리드등록알림", "slack!all-영업활동공유", "활동일지!박민수"],
    }
  - {
      canonical: "터전정보",
      variants: ["터전정보"],
      basis: "마침표 유무",
      seen_in: ["slack!all-영업활동공유"],
    }
  - {
      canonical: 봄빛에이아이,
      variants: ["봄빛AI"],
      basis: "한글 음차와 영문 약칭",
      seen_in: ["slack!all-영업활동공유"],
    }
  - {
      canonical: 파트너A,
      variants: ["파트너A(Lomin)"],
      basis: "괄호 안은 영문 상호",
      seen_in: ["slack!all-영업활동공유", "BD Overview!진척도!H3"],
    }
  - {
      canonical: 누리케미그룹,
      variants: ["누리케미그룹(가온테크놀로지)"],
      basis: "괄호는 계열사 주석",
      seen_in: ["slack!all-영업활동공유", "활동일지!7월13일~16일"],
    }
  - {
      canonical: "솔뫼서비스",
      variants: ["피에스앤마케팅(솔뫼서비스)"],
      basis: "정식 상호와 약칭",
      seen_in: ["slack!all-영업활동공유"],
    }
  - {
      canonical: 미소퍼스트코리아,
      variants: [미소퍼스트, "주식회사 미소퍼스트코리아"],
      basis: "법인 접두 + 국가 접미 축약",
      seen_in: ["slack!리드등록알림"],
      needs_human_confirm: true,
      confirm_reason: "'미소퍼스트'가 '미소퍼스트코리아'의 축약인지 별개 법인인지 확인되지 않았다.",
    }
  - {
      canonical: 집보금,
      variants: ["집보금 스마트홈", "집보금(스마트홈)"],
      basis: "괄호·공백은 사업부 주석으로 보인다",
      seen_in: ["slack!all-영업활동공유"],
      needs_human_confirm: true,
      confirm_reason: "'스마트홈'이 사업부인지 별도 법인인지 미확인. 병합 시 Deal 을 분리해야 할 수 있다.",
    }

exclusions:
  - value: "내부 보고(법인폰)"
    where: "활동일지!일일보고(6.) 고객사 열"
    reason: "내부 업무 항목이 고객사 열에 들어갔다. Account 로 만들지 않는다."
  - value: ":e-mail: 이메일:"
    where: "slack!리드등록알림 (F1 구형 폼)"
    reason: "회사명이 빈 값일 때 다음 줄 라벨을 값으로 먹은 추출 잡음. 값은 같은 줄에서만 취해야 한다."
  - values: ["오로라소프트", "오로라소프트", "주식회사 오로라소프트"]
    where: "slack!리드등록알림"
    reason: "자사다. 리드 테스트 데이터로 등록된 건이 실재한다. Account 로 만들지 않고 account_kind=self 로만 기록한다."
  - value: "금주주간활동(홍길동)"
    where: "주간계획!6. 표 파싱 결과"
    reason: "블록 앵커가 B/C 열을 오가서 고객사 값으로 잘못 수집되는 것을 실제로 관측했다. 파서 함정이지 회사명이 아니다."
  - values:
      ["A 손해보험사", "B 손해보험사", "C 손해보험사", "A손해보험", "B캐피탈"]
    where: "documents!소미생명 제안서 · 오로라소프트 종합소개서(금융·비금융) p6"
    reason: >-
      대외 자료가 일부러 익명화한 이름이다. 어느 법인인지 자료에 없으므로 Account 로 만들면
      실체 없는 계정이 늘고, 실명 계정에 이으면 그것은 추측이다. 성과 수치는 발췌로 남으니
      사실은 보존된다. `looks_like_company` 는 '손해보험사'·'캐피탈' 접미사를 회사로 보므로
      규칙만으로는 걸러지지 않는다.

# ==========================================================================
# 2. 절대 병합하면 안 되는 쌍 (오병합 차단 케이스)
#    각 항목의 canonical 은 서로 완전히 달라야 한다. validate_contracts.py 가 검사한다.
# ==========================================================================
do_not_merge:
  - pair: [마바손해보험, 마바캐피탈]
    reason: "접두어 '하나'만 같고 전혀 다른 법인이다. REVISED §6 A4 의 명시적 차단 케이스."
    evidence: "마바손해보험은 pain 34건 + 활동일지 4곳, 마바캐피탈은 활동일지 홍길동 시트 + 별도 제안서('마바캐피탈 오로라웍스 솔루션소개.pptx.pdf')."
  - pair: [마바손해보험, 가람은행]
    reason: "다른 법인."
  - pair: [마바손해보험, 마바증권]
    reason: "다른 법인."
  - pair: [마바손해보험, 마바카드]
    reason: "다른 법인."
  - pair: [가람은행, 마바투어]
    reason: "다른 법인. Slack #all-영업활동공유에 둘 다 등장."
  - pair: [가나손해보험, 가나은행]
    reason: "다른 법인. Slack 제목 첫 토큰 빈도 가나손해보험 37 / 가나은행 15 로 둘 다 활발한 별개 딜."
  - pair: [가나손해보험, 가나금융지주]
    reason: "다른 법인."
  - pair: [가나은행, 가나카드]
    reason: "다른 법인."
  - pair: [가나금융지주, 가나데이타시스템]
    reason: "다른 법인."
  - pair: [바람생명, 바람화재]
    reason: "다른 법인. 둘 다 활동일지·주간계획·Slack 에 별도로 등장."
  - pair: [바람생명, 바람증권]
    reason: "다른 법인."
  - pair: [바람화재, 바람카드]
    reason: "다른 법인."
  - pair: [바람카드, 바람SDS]
    reason: "다른 법인. 바람SDS 는 Slack 참석자 표기('바람SDS : 김온새 프로 외 1명')로만 등장하는 SI 사업자."
  - pair: [다라은행, 다라카드]
    reason: "다른 법인."
  - pair: [다라카드, 다라생명]
    reason: "다른 법인."
  - pair: [다라투자증권, 바다손해보험]
    reason: "다른 법인."
  - pair: [미르손해보험, 미르자동차]
    reason: "다른 법인."
  - pair: [미르카드, 미르캐피탈]
    reason: "다른 법인."
  - pair: [미르백화점, 미르리바트]
    reason: "다른 법인."
  - pair: [사아캐피탈, 마루캐피탈]
    reason: >-
      가장 위험한 쌍이다. 이름에 '우리캐피탈'이 겹치지만 완전히 다른 회사다.
      사아캐피탈은 이미 구축 완료 고객(pain 31건)이고, 마루캐피탈은 검토 단계 고객이면서
      동시에 AI QA 데모 시나리오(62p)의 대상이다.
  - pair: [두레은행, 사아금융저축은행]
    reason: "다른 법인."
  - pair: [터전손해보험, 터전증권]
    reason: "다른 법인."
  - pair: [터전손해보험, "터전정보"]
    reason: "다른 법인. 터전정보는 Slack 에만 등장."
  - pair: [터전캐피탈, 터전생명]
    reason: "다른 법인."
  - pair: [누리손해보험, 누리생명보험]
    reason: "손보와 생보는 별개 법인. 활동일지 이영희 시트와 박민수 시트에 각각 등장."
  - pair: [하늘IT, 하늘생명]
    reason: "다른 법인. 하늘IT 는 IT 자회사이고 GQ-D6 의 대상이다."
  - pair: [하늘IT, 하늘문고]
    reason: "다른 법인."
  - pair: [늘봄캐피탈, 늘봄화재]
