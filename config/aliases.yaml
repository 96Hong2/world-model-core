ambiguous_terms:
  - term: GA
    slack_frequency: 250
    candidates: [bd.insurance_planning_support, bd.insurance_sales]
    do_not_auto_map: true
    reason: >-
      GA(General Agency, 법인보험대리점)는 BD 이름이 아니다.
      보험설계지원의 Guest 역할('외부 모집사(GA) 설계사')이면서 동시에 보험영업의 타겟기업('보험사/GA')이다.
      LeadFlow 구분 규칙: "보험사가 GA 설계사를 지원 → 보험설계지원 / 설계사가 고객에게 판매 → 보험영업".
      토큰만으로는 구분 불가하므로 문맥 없이 BD 를 붙이지 않는다.
  - term: 설계사
    slack_frequency: 76
    candidates: [bd.insurance_planning_support, bd.insurance_sales]
    do_not_auto_map: true
    reason: "GA 와 같은 이유. 보험설계지원의 Guest 이자 보험영업의 BR 이다."
  - term: 상담
    candidates: [bd.contact_center]
    do_not_auto_map: true
    reason: "bd-seed.yaml activity_log_domain_map 참조. 74회로 최다지만 BD 고객센터인지 레거시 상담 사업인지 미확정."
  - term: CS
    candidates: [bd.contact_center]
    do_not_auto_map: false
    reason: "멀티BM 시트가 CS를 전 업권 공통 BD로 명시하고 BM 정의의 '고객센터'와 대응한다. 매핑해도 된다."
  - term: WM
    slack_frequency: 11
