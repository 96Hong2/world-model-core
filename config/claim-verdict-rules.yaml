# --------------------------------------------------------------------------
# A4 차단 케이스 (반드시 테스트로 고정한다)
# --------------------------------------------------------------------------
blocking_tests:
  - id: BT-1
    name: 일반화 Claim 자동 VERIFIED 차단
    input: "BD Overview 시장사이즈·기대효과의 B2B유통 계열 평가"
    expect_observation: CONFIRMED
    expect_claim_status: CANDIDATE
    rule: "bd_registry × market_assessment"
    fail_if: "Claim 이 VERIFIED 로 적재되면 실패."
  - id: BT-2
    name: 제안서가 기능맵을 이기지 못함
    input: "제안서의 '지원' 서술 vs 기능맵의 버전 컬럼"
    expect: "product_behavior 질문에서 release_spec Evidence 가 proposal Evidence 보다 위에 인용된다."
    fail_if: "1.x 사용 고객 질문에 제안서 근거로 '지원'이라 답하면 실패."
  - id: BT-3
    name: LLM 이 status 를 쓰지 못함
    input: "LLM 추출 결과에 status=VERIFIED 포함"
    expect: "파이프라인이 거부."
  - id: BT-4
    name: 근거 없는 비즈니스 엣지 생성 불가
    input: "claim_ids 가 빈 비즈니스 엣지"
    expect: "스키마 검증에서 거부(ontology.schema.json edgeBusiness.claim_ids minItems 1)."
  - id: BT-5
    name: 오병합 차단
    input: "마바손해보험 / 마바캐피탈"
    expect: "서로 다른 Account 노드 2개."
  - id: BT-6
    name: 보존 검사
    input: "Evidence 에 없는 숫자가 Claim statement 에 등장"
    expect: "T2 게이트에서 차단(숫자·고유명사 보존 검사)."
