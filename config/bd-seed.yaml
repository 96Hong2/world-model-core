# BusinessDomain 시드 (A0 확정판)
#
# 정본: data/sources/wiki/BD Overview.xlsx — 7시트 전량을 openpyxl(data_only=True)로 직접 열어 확인했다.
# 보조 정본: LeadFlow_BD분류_프롬프트.md §3 (BD 15개 정의문 + "BD가 아닌 것" 금지 목록)
#
# 왜 20개인가
#   BM 정의 시트는 14개 BD만 정의한다(r3~r19, 퇴직연금·신용평가가 다중행이라 행 수는 17).
#   시장사이즈·진척도·기대효과 시트는 BM 정의에 없는 이름 6개(제조·식자재유통·물류·렌털·프랜차이즈·플랫폼)를 BD 행으로 다룬다.
#   시장사이즈 각주 r20 원문: "** 새롭게 정의된 BM 기준으로는 시장 사이즈가 모호할 수 있기에 당분간 유지"
#   진척도 각주 r25 / 기대효과 각주 r21 원문: "** 새롭게 정의된 BM 기준으로 개척 활동 진행 후 판단 필요"
#   → 신·구 명칭이 2벌로 병존한다는 사실은 원문에 명시돼 있지만, "신 A = 구 B" 매핑표는 어느 시트에도 없다.
#   그래서 14 + 6 = 20개를 각각 노드로 두고, 확실한 표기 변형만 aliases 로 묶었다.
#   추정에 불과한 신↔구 대응은 절대 aliases 에 넣지 않고 merge_hypothesis + needs_human_confirm 으로 분리했다.
#
# 값 표기 규칙
#   market_size_note / target_company_detail 은 원문 문자열 그대로다(숫자가 아니다). "\n"은 " / "로 폈다.
#   maturity 는 진척도 시트 값 그대로(✔ / 제외 / null). ⚠️ 범례 r20·r21이 같은 "✔" 기호에
#   "완료"와 "보완필요" 두 라벨을 달아 두어 값만으로는 구분할 수 없다(색상 구분 추정, data_only 로는 미확인).

