# Need Taxonomy 초판 (A0 확정)
#
# 목적 (REVISED §3 Need Canonicalization)
#   "카톡으로 업무해서 통제가 안 됨" / "개인 메신저 사용으로 정보 관리가 어려움" / "업무 대화 이력 관리가 어려움" 이
#   각각 다른 Need 노드로 흩어지면 GQ-D4(여러 BD 공통 Need)·GQ-D5(확장 가능 Capability)가 성립하지 않는다.
#
# 수록 기준 (엄격)
#   실측 자료에서 **최소 2개 이상의 서로 다른 고객사 또는 서로 다른 소스에서 반복 확인된 Pain 만** 넣었다.
#   근거 1건짜리 항목은 넣지 않았다(그건 canonical 이 아니라 개별 Observation 이다).
#   추측으로 만든 항목은 0개다. 모든 항목에 raw_expressions(원문 그대로) 와 evidence_hint(locator) 가 있다.
#
# 운용 규칙
#   - canonical 항목은 이 파일에만 존재한다. LLM 은 기존 항목으로의 매핑 후보 제안까지만 하고 신규 canonical 생성 금지.
#   - 매핑 실패는 unmapped 로 기록만 하고 taxonomy 갱신은 사람이 한다.
#   - Raw 표현은 Evidence/Observation 에 원문 그대로 보존한다. 이 파일의 raw_expressions 는 매핑 시드일 뿐 원문 저장소가 아니다.
#
# 주 근거
#   고객사 Pain Point·구축 대응 통합 관리.xlsx / Pain Point 목록 95행 (마바손해보험34·사아캐피탈31·카파전선15·타하렌터카15)
#   비정형 문서 23종에서 뽑은 Pain 원문 92개 (data/raw_probe/docs-inventory.md §A)

