  - raw: "불필요한 채널명 노출로 화면 복잡 / 말풍선·네비 아이콘 가시성 낮아 빠르게 인식 어려움"
    reason: "UI/UX 개별 개선 요구(pain 분류 'UI/UX·사용성' 6건). 고객사 1곳에서만, 그것도 개별 화면 단위로 등장해 canonical Need 가 아니다."
  - raw: "렌터카 정비상품(R101~ 등) 종류가 많아 대화방 분류 필요"
    reason: "원문 스스로 '렌터카 특유의 상품 세분화 구조에서만 발생하는 니즈'라고 적었다. cross-BD 항목이 아니다."
  - raw: "없음(순수 생산성 확장) / 없음(첨부 편의)"
    reason: "pain 원문이 'Pain 없음'이라고 명시한 행(No.77·No.80). Need 로 만들면 안 된다."
  - raw: "제품 자체의 고객 문제 5개(도입 구성 선택 제약·기술 정책 수용 제약 등)"
    reason: "CX관점아키텍처검토.html 의 제품 내부 품질 과제다. Need 를 '제품 자체의 Need' 로 오염시키게 되므로 1B 로 미룬다."

taxonomy_governance:
  who_updates: 사람만
  llm_role: "기존 항목으로의 매핑 후보 제안까지만. 신규 canonical 항목 생성 금지."
  unmapped_policy: "매핑 실패는 Need.canonical=false + unmapped_raw 로 기록만 하고 taxonomy 는 갱신하지 않는다."
