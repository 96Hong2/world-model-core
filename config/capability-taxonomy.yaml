deliberately_absent:
  - name: 구독 사업용 멀티테넌트(유저 라이선스 구조 포함)
    reason: >-
      하늘IT 협업 관련 검토 사항.pdf#PAGE 2 가 "멀티테넌트 구조 개발 필요 … 유저 라이선스 구조 등 고려하면 범위가 작진 않음"
      이라고 적는다. 보유 Capability 가 아니라 미보유 전제다.
      오로라웍스 온보딩.html 은 제품을 "엔터프라이즈 멀티테넌시 애플리케이션 · 센터 기반 데이터 격리"라고 소개하므로
      단순 키워드 검색이면 "이미 지원한다"는 잘못된 답이 나온다. GQ-D6 이 이 구분을 시험한다.
      두 문장의 대상이 다르다: 센터 기반 데이터 격리(보유, cap.multi_center) ≠ 구독형 멀티테넌트(미보유).
    gap_verdict_expected: CONFIRMED
    gap_basis_evidence: "하늘IT 협업 관련 검토 사항.pdf#PAGE 2 고려사항 블록"
  - name: AG 영업 성과 평가 자동화
    reason: >-
      자동차금융 Open Book.pdf#PAGE 8~9 가 "핵심 목적이 아닌 것"으로 명시한다(고객 마케팅 ✗, 상품 비교 ✗, AG 평가 ✗).
      단 "기술적으로는 가능합니다"라고 덧붙인다. CONFIRMED GAP 이 아니라 '의도적 비범위'로 구분해야 한다.
    gap_verdict_expected: UNKNOWN
    gap_basis_flag: out_of_scope_by_design
  - name: 오로라웍스 메일 구축 레퍼런스
    reason: >-
      B2B 메일(퇴직연금 대상) 소개서.pptx#SLIDE 17 이 "동일한 형태의 구축 레퍼런스는 아직 준비 중입니다" 라고 스스로 밝힌다.
      Capability(cap 로는 미등재) 자체는 제안 중이지만 레퍼런스가 없다는 사실이 명시적 근거로 존재한다.
    gap_verdict_expected: CONFIRMED

taxonomy_governance:
  who_updates: 사람만
  llm_role: "기존 항목으로의 매핑 후보 제안까지만. 신규 canonical 항목 생성 금지."
  granularity_guard: >-
    기능맵의 393개 기능명을 그대로 Capability 로 올리지 않는다. Feature-IMPLEMENTS->Capability 로 연결한다.
