# Capability Taxonomy 초판 (A0 확정)
#
# 굵기 (v1.0 §D-1)
#   Capability = "영업 언어 수준의 해결 능력 + add-on 라이선스 단위".
#   기능맵 393개 Feature 굵기가 아니다. 영업 자료는 이 굵기로 말하며, 이 층이 없으면 추출이 고객 요구를
#   393개 기능에 강제 오매핑한다.
#
# 수록 기준
#   실측 문서에서 확인한 표현만 넣었다. 모든 항목에 evidence_hint(locator) 가 있고 추측 항목은 0개다.
#   ⚠️ 정정: 지시문에 "제품소개서 vision 본에 23개 Capability 가 정리돼 있다"고 되어 있으나, 63쪽 전문을 읽은 결과
#   "23개"로 번호 매겨진 목록은 존재하지 않는다. 실제로 있는 것은 '제품 특징' 14슬라이드(p15~28)와
#   '제품 기능' 30슬라이드(p30~59)다. 23이라는 숫자의 출처는 미확인이다.
#
# 운용 규칙
#   canonical 항목은 이 파일에만 존재한다. LLM 은 매핑 후보 제안까지만, 신규 canonical 생성 금지.

