# Criticality 태깅 규칙 (REVISED §4 ⑤)
#
# 목적
#   규칙 하나라도 걸리면 lane=critical + status=CRITICAL/UNVERIFIED 가 되고, 검증 여부와 무관하게
#   **검색 결과에서 절대 제외되지 않는다.** 승격이 목적이 아니라 누락 방지가 목적이다.
#   승격을 기다리면 이미 누락이다(v1.0 §E-3).
#
# 1A 범위
#   전부 deterministic 규칙이다. 규칙이 못 잡는 신호를 S tier 가 후보 태깅하는 2단 구성은 1B(B3).
#   S tier 는 소넷 이상이다(tiers.yaml model_policy). 「Small LLM」은 역할 이름이고 싼 모델을 뜻하지 않는다.
#   사람 승인 워크플로우는 V2.
#
# 규칙마다 basis(왜 이 값·이 키워드인가) 와 measured_example(실측 원문) 을 붙였다.

version: "1.0.0"
default_lane_on_fire: critical
status_on_fire:
  when_verified_allowed: CRITICAL
  when_not_verified_allowed: UNVERIFIED

rules:
  - id: CR-HIGH-VALUE-DEAL
    name: 고액 딜
    applies_to: [Deal, Observation, Claim]
    condition:
      field: amount_krw
      operator: ">="
      value: 300000000
    basis: >-
      활동일지 일일보고 5.영업 진행 현황의 예상매출 원문 11종을 실측한 결과 분포는
      5억 · 4억(→3.44억) · 2.85억 · 2.7억 · 2억 · 1.9억 · 0.8 · 0.6억 · 0.5 · '-' 다.
      3억을 문턱으로 잡으면 상위 4건(바람화재 5억 · 다라카드 자동차 4억 · 누리손해보험 4억→3.44억 · 가나손해보험 2.85억)이 걸린다.
      회사 연 매출 목표가 60억(매출전망 시트: 목표 6,000,000,000 / 달성 1,745,221,025 / 달성률 0.2909)이므로
      3억은 연 목표의 5% 규모다.
    measured_example: "활동일지!일일보고(6월15일) 5.영업 진행 현황 — 가나손해보험 / 제안 / 2.85억 / 0.8"
    caution: >-
      amount_raw 원문이 '0.8'·'0.5' 처럼 억 단위를 생략하거나 '4억 -> 3.44억' 처럼 변경 이력을 한 셀에 담는다.
      정규화에 실패하면 규칙을 발화시키지 말고 CR-AMOUNT-UNPARSEABLE 로 보낸다.

  - id: CR-AMOUNT-UNPARSEABLE
    name: 금액 파싱 실패
    applies_to: [Deal]
    condition:
      field: amount_krw
      operator: "is_null_but_raw_present"
    basis: "금액 표기가 통일돼 있지 않아 파싱 실패가 실재한다. 조용히 버리면 고액 딜을 놓친다."
    measured_example: "주간계획!5. 표 금액 '31.억'(오타), 활동일지 예상매출 '4억 -> 3.44억'"

  - id: CR-LOST-DEAL
    name: 실패·중단 딜
    applies_to: [Deal, Observation]
    condition:
      any_of:
        - { field: outcome, operator: "==", value: lost }
        - { field: stage_value, operator: "in", value: [실패, 실패마감처리] }
        - {
            field: current_issue,
            operator: "in",
            value:
              [
                연락단절,
                예산미확보,
                고객도입필요성낮음,
                고객반응낮음,
                경쟁심화,
              ],
          }
    basis: >-
      일일보고 5번 섹션 단계 enum 실측(14장 합산): 제안 20 · 협상 12 · 검수 2 · 실패 1.
      실패가 단 1건이라 빈도 기반 승격으로는 절대 올라오지 못한다. 정확히 rare-critical 이다.
      사람별 시트 '현재이슈' enum 실측: 없음 7 · 고객도입필요성낮음 4 · 예산미확보 2 · 연락단절 1 · 경쟁심화 1 · 기술이슈 1 · 고객반응낮음 1 · 일정지연 1.
    measured_example: "활동일지 사람별 시트 U열(비고) '실패마감처리' 1건"

  - id: CR-REGULATION-SECURITY
    name: 규제·보안 키워드
    applies_to: [Evidence, Observation, Claim]
    condition:
      text_contains_any:
        - 개인정보보호법
        - 신용정보법
        - 채무자보호법
        - 개인금융채권
        - 추심총량제
        - 연락제한 요청권
        - 채무조정 요청권
        - 책무구조도
        - 1200%룰
        - 과징금
        - 금융감독원
        - 금융위원회
        - 감독원 제재
        - KISA
        - 모의해킹
        - 보안 심의
        - 취약점 진단
        - 망분리
        - VDI
        - 폐쇄망
        - 컴플라이언스
        - 제3자정보제공동의
        - 불완전판매
        - 주민번호
        - 주민등록번호
    basis: >-
      실측한 문서 23종 중 규제 언급이 딜의 성패를 직접 좌우한 사례가 다수 확인된다.
      자차캐피탈 도입추진(안) Ⅱ-2 는 '위반 시 과징금(매출액 연동)·기관 및 임직원 제재'를 도입 근거로 든다.
      Q&A 자료 Q1 은 '제3자정보제공동의 없이 전달 — 법적으로 위반이라고 고객사에서 얘기함'을 현장 반문 1번으로 적는다.
      GA Open Book p9 는 '책무구조도 시행 … 금융판 중대재해처벌법'을 든다.
      키워드 목록은 전부 실측 원문에서 뽑았고 추측으로 추가한 항목은 없다.
    measured_example: "채권추심 BM Open Book.pdf#PAGE 3 '추심총량제, 연락제한 요청권, 채무조정 요청권 대응에 효율적인 디지털 채널 필요'"

  - id: CR-STRATEGIC-ACCOUNT
    name: 전략 계정
    applies_to: [Account, Deal, Observation, Claim]
    condition:
      account_canonical_in:
        - 가나손해보험
        - 누리손해보험
        - 두레은행
        - 바람화재
        - 모다패션
        - 다라카드
        - 마바손해보험
        - 솔뫼텔레콤
        - 가나은행
        - 들찬증권
        - 미리내저축은행
        - 누리저축은행
        - 사아캐피탈
        - 하늘IT
    basis: >-
      두 개의 독립 근거를 교집합이 아니라 합집합으로 잡았다.
      (1) 활동일지 일일보고 5.영업 진행 현황에 실제로 오른 고객사 9종
          (누리손해보험 · 두레은행 · 바람화재 · 가나손해보험 · 모다패션 · 다라카드 채권 · 마바손해보험 · 솔뫼텔레콤 · 다라카드 자동차)
      (2) 주간계획 '5. 사업실행협의 이상 고객사'에 반복 등장한 6종
          (가나은행 10회 · 모다패션 8 · 들찬증권 8 · 다라카드 7 · 미리내저축은행 5 · 누리저축은행 5)
      여기에 구축 완료 고객 중 확장 딜이 진행 중인 사아캐피탈과 신규 사업 모델 검토 대상인 하늘IT를 더했다.
    measured_example: "주간계획!5. — '가나은행 | 영업점 채팅상담(파일럿) | 3억 | 연내 파일럿시스템 구축 승인'"
    maintenance: "이 목록은 시간에 따라 변한다. Snapshot MVP 라 하드코딩하되 출처를 함께 남긴다."

  - id: CR-COMPETITOR-REPLACEMENT
    name: 경쟁·대체 신호
    applies_to: [Evidence, Observation, Claim]
    condition:
      text_contains_any:
        - 협업툴A
        - 협업툴B
        - 플로우
        - 협업툴D
        - 자체 구축
        - 내재화
        - 제 3의 업체
        - 제3의 업체
        - 재견적
        - 금액 점수 격차
        - 우선협상대상자
        - 견적심의
        - 타사 도입
        - 경쟁심화
    basis: >-
      실측에서 경쟁 신호가 딜을 직접 흔든 사례가 두 건 확인된다.
      (1) 활동일지 일일보고 5. 가나손해보험 현재 이슈 '우선협상대상자 선정 핵심 걸림돌(금액 점수 격차) 확인' — GQ-D1 의 정답 근거.
      (2) Slack #all-영업활동공유 '한울SI - 누리손해보험 견적 관련 협의' — '제 3의 업체 컨택 가능성을 언급하며 전략적인 금액 제안 요청 받음'.
      경쟁사 4종은 [자차캐피탈] 도입추진(안) TABLE 5 비교표에서 뽑았다(23종 중 유일한 경쟁사 비교표).
    measured_example: "활동일지!일일보고(6월15일) — 가나손해보험 '구매팀 추가 협의 미팅 / 우선협상대상자 선정 핵심 걸림돌(금액 점수 격차) 확인'"

  - id: CR-RARE-TECH
    name: 1회 등장 기술 전제
    applies_to: [Evidence, Observation, Claim]
    condition:
      term_document_frequency: 1
      scope: "1A sources.yaml 의 documents 그룹"
      seed_terms:
        - 멀티테넌트
        - 멀티태넌트
        - multitenant
        - AWS Marketplace
        - MRR
        - ARR
        - Co-Sell
        - Joint Business Plan
    basis: >-
      실측: 문서 23종을 '멀티테넌트|멀티태넌트|multitenant|멀티테넌시' 로 grep 하면 3개 파일에 나오는데 의미가 전부 다르다.
        · 하늘IT 협업 관련 검토 사항.pdf (2회) — 구독 사업을 하려면 아직 개발해야 하는 전제(미보유)
        · LeadFlow_BD분류_프롬프트.md (4회) — 리드 request_type 분류값(문의 유형)
        · 오로라웍스 온보딩.html (3회) — 제품 설명 '엔터프라이즈 멀티테넌시 애플리케이션'(보유한 것처럼 읽힘)
      단순 키워드 검색이면 온보딩 쪽이 먼저 잡혀 "이미 지원한다"는 잘못된 답이 나온다.
      또 AWS · MRR/ARR · Marketplace 는 23종 중 하늘IT 문서 하나에만 등장한다.
      즉 구독 사업 관련 전제가 문서 하나에 몰려 있고, 빈도 기반 랭킹으로는 반드시 사라진다.
    measured_example: >-
      하늘IT 협업 관련 검토 사항.pdf#PAGE 2 — "멀티테넌트 구조 개발 필요 (Saas로 이야기되었는데 이 부분 검토 후 협의 필요)
      / 개발 필요 : 유저 라이선스 구조 등 고려하면 범위가 작진 않음 / 홍길동님과 확인 필요 현 구조 (하늘IT+오로라소프트 한서버에서 멀티 고객 대응)"
    golden_link: GQ-D6
    implementation_note: >-
      term_document_frequency 는 ingest 완료 후에 계산 가능하다. 그래서 1A 파이프라인은 2패스로 돈다:
      1패스에서 문서별 용어 빈도표를 만들고, 2패스에서 이 규칙을 적용한다.
      seed_terms 는 R0 에서 실측으로 확인한 것이라 1패스 없이도 즉시 발화한다.

  - id: CR-EXEC-SIGNAL
    name: 경영진 의사결정 신호
    applies_to: [Evidence, Observation, Claim]
    condition:
      text_contains_any:
        - 경영진 의사결정
        - 경영진 보고
        - 경영진 대상
        - 임원보고
        - 임원 보고
        - 내부 방향성
        - 의사결정 사항
        - 핵심 의사결정
        - 내부 결재
        - 사업 계획 논의
    basis: >-
      실측 원문 3건.
      (1) 활동일지!일일보고(6월15일)!r36 '지원 필요 = 경영진 의사결정 지원' — REVISED §5 rare-critical 신호의 실물 예시로 마스터플랜이 직접 지목한 항목.
      (2) 주간계획 블록 내부 섹션 '1. 주간활동 특이사항, 의사결정사항, 경영진 보고필요사항 등' — 서식 자체에 경영진 보고 칸이 있다.
      (3) 하늘IT 검토 문서 '3. 핵심 의사결정 사항 #1' / 결론 '내부 방향성을 우선 정리 후 개발 및 사업화를 추진할 필요가 있다고 판단됩니다.'
      또 활동일지 일일보고 5. 모다패션 이슈에 'RFP 결과 발표가 모다패션 내부 결재 일정으로 연기'가 있다.
    measured_example: "활동일지!일일보고(6월15일)!r36 '경영진 의사결정 지원'"

  - id: CR-EXPLICIT-ABSENCE
    name: 명시적 기능 부재·불가
    applies_to: [Evidence, Observation, Claim]
    condition:
      text_contains_any:
        - 불가
        - 제외
        - 부재
        - 개발 필요
        - 커스터마이징 불가
        - 변경이 불가
        - 지원하지 않
        - 레퍼런스는 아직
        - 준비 중입니다
        - 정책 종속
        - 대체 제공
        - 절충 제공
    basis: >-
      Product Gap 3값 판정에서 CONFIRMED 를 주장하려면 '명시적 기능 부재 확인' Evidence 가 반드시 있어야 한다.
      그 Evidence 는 빈도가 낮아 검색에서 사라지기 쉬우므로 critical 로 보존한다.
      실측 근거: pain!대응 불가·제약 시트 12건(구분 enum 2종 '카카오 플랫폼 제약' 7 / '구조·정책 상충' 5,
      처리 결과 enum '불가'·'제외'·'정책 종속 안내'·'대체 제공'·'절충 제공'·'보류'·'보안 정책상 제한').
    measured_example:
      - "pain!대응 불가·제약 (발생 고객사가 '카파전선·마바손해보험' 처럼 '·' 결합 복합값)"
      - "B2B 메일(퇴직연금 대상) 소개서.pptx#SLIDE 17 '동일한 형태의 구축 레퍼런스는 아직 준비 중입니다'"
      - "[사아캐피탈]...추진안.docx#8 '카카오 고유 UI 영역은 커스터마이징 불가'"
      - "오로라웍스 사용자 매뉴얼(상담센터) '카카오에서는 [지원 파일]과 [최대 사이즈] 설정 변경이 불가합니다'"
    golden_link: [GQ-D3, GQ-D6]

  - id: CR-AI-FAILURE
    name: AI 산출 실패 기록
    applies_to: [Evidence, Observation]
    condition:
      text_contains_any:
        - 답변하지 못함
        - 현재 답변 가능한 내용이 없습니다
        - 예상 답변
    basis: >-
      채권추심 지원 Agent 테스트.xlsx 답변(C)열 실측 — 정상 답변 외에
      '고객님, 죄송합니다. 현재 답변 가능한 내용이 없습니다.' 1건,
      '답변하지 못함.\n-------------------\n예상 답변' + 사람이 적은 기대 답변 3건(No.12·22·23)이 있다.
      실패 사례는 3~4건뿐이라 빈도로는 절대 안 올라오지만 AI 성능 질문의 핵심 근거다.
    caution: >-
      이 셀은 '실제 산출물'과 '사람이 생각하는 정답'이 한 셀에 섞여 있다.
      '-------------------\n예상 답변' 구분선으로 분리하지 않으면 AI 가 답한 것처럼 오독된다.
    status_1a: "sources.yaml 에 ai_eval_dataset 을 넣지 않았으므로 1A 에서는 발화하지 않는다. 규칙만 준비한다."

  - id: CR-CONTRADICTION-SEED
    name: 기지의 상충 주제
    applies_to: [Evidence, Observation, Claim]
    condition:
      subject_key_in:
        - 회사_비즈니스_업력
        - 미국_금융권_개인메신저_벌금
        - 인건비_1인당_원가
        - 제품_현행_버전
        - 시스템_구성_서비스_수
        - 데이터_보관_기간
        - 설계매니저_규모
        - 다라카드_사용_규모
        - BD_개수
    basis: >-
      R0 에서 문서 간 상충 10건을 원문 두 곳을 모두 열어 확정했다(data/raw_probe/docs-inventory.md §C).
      대표: 업력 27/26/25/20여년, 미국 금융권 벌금 180M$ vs 18억$(정확히 10배), 1인당 원가 0.5억 vs 1.2억,
      제품 버전 1.0.0/2.0.0.DEV/2.1, 서비스 수 5/15/25, 보관기간 90일 vs 5년, BD 개수 14/15/20.
      1A 는 lane=conflict 부여(측정)까지만 하고 병렬 제시 UX·단일합성 금지 가드는 1B(B3) 다.
    lane_override: conflict
    golden_link: GQ-D7

  - id: CR-NO-OBSERVED-AT
    name: 관측 시점 미표기 수치
    applies_to: [Observation, Claim]
    condition:
      all_of:
        - { field: statement, operator: "contains_number" }
        - { field: observed_at, operator: "is_null" }
    basis: >-
      [사아캐피탈] 추진안 TABLE 4 는 다라카드 사용 규모를 '월 3,500건 이상'이라고 적는데 관측 시점 표기가 아예 없다.
      같은 지표를 공적내용양식(다라카드)은 '2024.03.27~03.29 3일간 일평균 약 10여 건'으로 적는다.
      시점이 다르면 모순이 아니지만, 시점이 없으면 판정 자체가 불가능하다. observed_at 필수 필드의 실제 필요 근거다.
    action: "차단이 아니라 태깅. 답변에 '관측 시점 미상' 캐비앗을 단다."

evaluation_guard:
  note: >-
    A8 골든에 criticality 대조군을 반드시 넣는다. 규칙이 전부 발화하지 않는(=아무것도 critical 이 아닌) 상태에서도
    통과하는 테스트만 있으면 태거가 죽어 있어도 모른다. 1B Gate 의 'critical 신호 발화 수 하한(대조군)'이 그것이다.
  deliberate_break_check: "규칙 하나를 일부러 꺼서 GQ-D6 이 실패하는지 확인하고 되돌린다."
