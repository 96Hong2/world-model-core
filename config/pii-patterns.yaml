# PII 마스킹 규칙 (REVISED §4 ② / Gate 1A 항목 5)
#
# 강제 조건
#   마스킹은 **파서 단계**에서 한다. 마스킹 전 데이터는 저장하지 않는다.
#   Gate 1A 항목 5: 답변·evidence·subgraph 어디에도 전화번호 정규식 매칭 0건.
#   → 마스킹 결과 문자열은 아래 detectors 의 어떤 정규식에도 다시 매칭되면 안 된다(self-check 로 검증).
#
# 실측 PII 분포 (전체 98셀 + Slack 271건 + 문서 6종)
#   xlsx : 활동일지 70셀(7월6일~10일!I 43 · 7월13일~16일!I 15 · 일일보고 9시트 H 12)
#          주간계획 27셀(H열: 홍길동 14 · 김철수 8 · 이영희 5 · 박민수 0)
#          AI QA 대화 예제 1셀(마루캐피탈!B260 — 대화 본문 안, 열 이름으로는 못 잡음)
#          기능맵·BD Overview·pain·compliance·agenttest: 0건
#   slack: 전화 271 · 이메일 140 · 사업자번호형 10자리 103 (리드등록알림이 전화 170으로 압도적)
#   docs : GA Open Book(phone4/mobile2/rrn1) · Q&A html(2/1/1) · 채권추심 Open Book(phone3)
#          공적내용양식(1/1/1) · B2B 메일(email2) · 제품소개서 vision(정규식 0이나 본문에 실재)
#
# 정규식만으로는 부족하다는 것이 실측 결론이다(§named_entities 참조).

version: "1.0.0"
apply_stage: parser
store_unmasked: false

# --------------------------------------------------------------------------
# 0. 전처리 — 마스킹보다 먼저 해야 한다
# --------------------------------------------------------------------------
preprocess:
  - id: PRE-SLACK-LINK
    description: Slack 링크 문법을 해체한 뒤 마스킹한다.
    patterns:
      - "<tel:(?P<target>[^|>]+)\\|(?P<display>[^>]*)>"
      - "<mailto:(?P<target>[^|>]+)\\|(?P<display>[^>]*)>"
    action: "target 과 display 를 각각 독립 문자열로 꺼내 둘 다 마스킹한다."
    basis: >-
      실측: <tel:010-1234-5678|010-1234-5678>, <mailto:kim.cs@partner.example|kim.cs@partner.example>.
      평범한 정규식은 링크 타깃 쪽을 놓친다.
      더 나쁜 사례로 <tel:0101234567890|010-8765-4321> 처럼 타깃과 표시값이 아예 다른 건이 있다.
    measured_count: "리드등록알림 <tel: 33건 · <mailto: 35건 / team-영업본부 <tel: 3 · <mailto: 7"
  - id: PRE-MENTION
    description: "<@Uxxxx|이름> 멘션 문법에서 이름 부분만 남긴다."
    patterns: ["<@(?P<uid>U[A-Z0-9]+)\\|(?P<name>[^>]*)>"]
    action: "uid 는 버리고 name 만 남긴 뒤 named_entities 규칙을 적용한다."
  - id: PRE-NEWLINE-CELL
    description: 한 셀에 개행으로 여러 값이 들어간 경우 줄 단위로 나눈 뒤 각각 마스킹한다.
    basis: "주간계획!H열 실측 '010-XXXX-XXXX\\n010-XXXX-XXXX' (담당자 2명분이 한 셀)"

# --------------------------------------------------------------------------
# 1. 정규식 탐지기
# --------------------------------------------------------------------------
detectors:
  - id: PII-MOBILE
    name: 휴대전화
    regex: "01[016789][-. ]?\\d{3,4}[-. ]?\\d{4}"
    mask_template: "010-****-****"
    priority: 10
    basis: >-
      실측 형태 3종: 하이픈 있는 '010-1234-5678', 하이픈 없는 '01087654321', 그리고 13자리 오입력 '0101234567890'.
      구분자를 하이픈·점·공백 셋 다 허용해야 한다.
    known_hits:
      - "활동일지!7월6일~10일!I (43셀)"
      - "활동일지!7월13일~16일!I (15셀)"
      - "활동일지!일일보고 9시트!H (12셀 — 6.전략BD 연락처)"
      - "주간계획!H (27셀)"
      - "AI QA 대화 예제!마루캐피탈!B260 (대화 본문 안 '저희 번호는 010-1234-5678입니다')"
      - "GA Open Book.pptx.pdf#PAGE 7·9·14 (데모 캡쳐 '01087654321', '01011112222')"
      - "제품소개서 vision#PAGE 15 ('홍길동 / 010-2345-6789 / hong.gildong@gamil.com')"
    note: "더미 번호(010-1234-5678)도 마스킹한다. Gate 1A 는 '정규식 매칭 0건'이지 '실재 PII 0건'이 아니다."

  - id: PII-LANDLINE
    name: 유선전화
    regex: "0(?:2|3[1-3]|4[1-4]|5[1-5]|6[1-4])[-. ]?\\d{3,4}[-. ]?\\d{4}"
    mask_template: "0*-****-****"
    priority: 20
    basis: >-
      실측: 채권추심 BM Open Book.pdf#PAGE 6 안내 예시의 '02-769-0321', '02-987-6543'(실제 대표번호로 보임),
      제품소개서 vision#PAGE 63 '02-123-4567'(회사 대표번호).
      지역번호 목록은 국내 체계 그대로다.

  - id: PII-SERVICE-NUMBER
    name: 대표번호(15xx/16xx/18xx)
    regex: "1[5-9]\\d{2}[-. ]?\\d{4}"
    mask_template: "1***-****"
    priority: 30
    basis: "실측: 공적내용양식 (다라카드).docx 의 기사 인용 '1588-0000'(두레카드 상담센터)."
    note: >-
      개인정보는 아니지만 PII-MOBILE·PII-LANDLINE 과 헷갈려 phone 히트로 잡히는 값이다.
      마스킹하지 않으면 Gate 1A 검증에서 전화번호 매칭으로 카운트될 수 있으므로 같이 마스킹한다.

  - id: PII-EMAIL
    name: 이메일
    regex: "[A-Za-z0-9._%+\\-]+@[A-Za-z0-9.\\-]+\\.[A-Za-z]{2,}"
    mask_template: "***@***.***"
    priority: 40
    known_hits:
      - "slack!team-CX (58건) · slack!리드등록알림 (70건) · slack!team-영업본부 (12건)"
      - "B2B 메일(퇴직연금 대상) 소개서.pptx (예시 'hr@aa.co.kr', 'hr@company.co.kr')"
      - "제품소개서 vision#PAGE 15 ('hong.gildong@gamil.com' — 원문 철자 그대로)"
      - "portal adoc operator_support.adoc:15 ('support@auroraworks.example' — 실제 지원 창구 주소)"
    allowlist:
      values: ["info@auroraworks.example", "support@auroraworks.example"]
      reason: >-
        자사 공개 창구 주소다. #리드등록알림 채널 운영 규칙 원문에 'info@auroraworks.example 과 같은 인바운드 메일로 접수되어도
        여기에 공유됩니다' 로 등장해 마스킹하면 채널 운영 규칙 자체가 읽히지 않는다.
      note: "allowlist 를 쓰더라도 Gate 1A 는 전화번호만 검사하므로 이메일 예외는 게이트에 영향이 없다. 사람 판단 필요."
      needs_human_confirm: true

  - id: PII-RRN
    name: 주민등록번호
    regex: "\\d{6}[-. ]?[1-4]\\d{6}"
    mask_template: "######-*******"
    priority: 5
    known_hits:
      - "GA Open Book.pptx.pdf#PAGE 14 ('900101-1111111', '9001011234567')"
      - "Q&A로 이해하는 고객의 고민...html ('990024-1111111')"
      - "사용자 교육_마바손해보험 vision#PAGE 8~9 (이미 마스킹된 '880807-1***' 형태)"
      - "B2B 메일 소개서.pptx#SLIDE 11 (마스킹 표본 '123456-2******')"
    note: "하이픈 없는 13자리('9001011234567')도 잡아야 한다. 성별코드 1~4 로 제한해 오탐을 줄인다."

  - id: PII-ACCOUNT-NO
    name: 계좌번호
    regex: "\\d{2,6}[-]\\d{2,6}[-]\\d{2,7}"
    mask_template: "***-***-*****"
    priority: 50
    require_context_within: 40
    context_keywords: [계좌, 입금, 출금, 송금, 이체, 예금, 은행, 무통장]
    basis: >-
      계좌번호는 은행마다 자릿수가 달라 형식만으로는 사업자번호·날짜·전화번호와 구분되지 않는다.
      그래서 앞뒤 40자 안에 계좌 맥락 키워드가 있을 때만 발화하도록 조건을 걸었다.
      직접 관측한 실제 계좌번호는 이번 실측에서 0건이다(미발견).
      규칙을 넣는 근거는 마바캐피탈 제안서 p13 '주민번호·계좌번호 같은 민감정보는 단체 대화방 입력 단계에서 막힙니다' 와
      AI QA 데모 시나리오 프롬프트의 '개인정보(이름/전화/계좌/주소/주민번호/이메일 등)를 출력하지 않습니다' 다.
    needs_human_confirm: true
    confirm_reason: "실측 히트가 0건이라 정규식·문턱을 실데이터로 조정하지 못했다. A2 에서 ingest 후 오탐률을 측정해야 한다."

  - id: PII-BIZ-NO
    name: 사업자등록번호
    regex: "\\d{3}-\\d{2}-\\d{5}|(?<!\\d)\\d{10}(?!\\d)"
    mask_template: "***-**-*****"
    priority: 60
    basis: >-
      실측: 하이픈 형식 '123-45-67890'·'105-86-73724' 와 하이픈 없는 '1338510955' 두 형식이 섞여 있다.
      Slack 4채널 합계 103건. #리드등록알림 워크플로우 봇 이름 자체가
      '신규 리드 등록 - 사업자등록번호도 같이 받아주시면 감사하겠습니다' 다.
    caution: >-
      하이픈 없는 10자리 패턴은 오탐이 크다. 아래 false_positive_guards 를 먼저 적용한다.
      타하렌터카 요구사항에 '사업자등록번호 10자리 입력·관리'가 있어 제품 기능 서술 안에서도 나온다.
    sensitivity_class: quasi_identifier

# --------------------------------------------------------------------------
# 2. 오탐 방지 (실측으로 확인된 것만)
# --------------------------------------------------------------------------
false_positive_guards:
  - id: FP-EPOCH-MS
    description: 13자리 epoch 밀리초를 전화번호·사업자번호로 오탐하지 않는다.
    pattern: "(?<!\\d)1[0-9]{12}(?!\\d)"
    basis: "portal adoc operator_log_search.adoc:369,406,409 의 '1700642391152' 가 전화번호 정규식에 걸리는 것을 실측했다."
    action: "탐지 제외. 단 010 으로 시작하는 13자리는 예외로 두고 마스킹한다(실측 '0101234567890')."
  - id: FP-SLACK-TS
    description: Slack ts 값(1743492135.982449)을 숫자열로 오탐하지 않는다.
    pattern: "(?<!\\d)1[0-9]{9}\\.[0-9]{6}(?!\\d)"
    action: "탐지 제외. ts 는 locator 로 보존해야 하는 값이다."
  - id: FP-VERSION-STRING
    description: 버전·좌표 문자열을 숫자열로 오탐하지 않는다.
    examples: ["2.2.0.DEV-SNAPSHOT", "1.1.0-SNAPSHOT", "Basic v2"]
    action: 탐지 제외
  - id: FP-DUMMY-INTERNAL-IP
    description: portal adoc 의 내부 IP 는 PII 가 아니라 민감정보다. 마스킹이 아니라 sensitivity=restricted 로 처리한다.
    basis: "172.16.100.* / 192.168.0.* / 211.63.24.* — 9개 파일 합계 92건. operator_system_component.adoc 에 서버명·OS·IP·SSH 포트·계정 표가 있다."
    action: "PII 마스킹 대상 아님. sources.yaml 에서 해당 경로를 restricted 로 등록하고 1A 에 넣지 않는다."

# --------------------------------------------------------------------------
# 3. 정규식으로 잡히지 않는 것 — 실명 (실측 결론: 정규식 4종으로는 부족하다)
# --------------------------------------------------------------------------
named_entities:
  status: partial
  needs_human_confirm: true
  confirm_reason: >-
    한국어 인명은 정규식으로 안전하게 잡을 수 없다. 아래 두 가지를 조합했으나 재현율·정밀도를 실측하지 못했다.
    사람이 정책을 확정해야 한다.
  strategies:
    - id: NE-COLUMN
      description: 열 이름 기반 선제 마스킹. 가장 확실한 방법이다.
      target_columns:
        - "활동일지!7월13일~16일!H (고객사 담당자)"
        - "활동일지!7월6일~10일!H (고객사 담당자)"
        - "활동일지!일일보고!G (담당자)"
        - "주간계획!G (고객사 담당자)"
      mask_template: "[담당자]"
      basis: "실측 PII 98셀이 전부 '연락처'·'고객사 담당자'라는 이름의 열에 몰려 있다. 열 이름으로 선제 마스킹이 가능하다."
    - id: NE-TITLE-SUFFIX
      description: 직급 접미 패턴으로 인명을 추정한다.
      regex: "[가-힣]{2,4}\\s?(님|씨|차장|부장|과장|대리|팀장|실장|본부장|이사|상무|전무|대표|책임|선임|프로|매니저|수석)"
      mask_template: "[이름] \\1"
      basis: >-
        실측 원문 형태(합성 예시): '홍길동님'(하늘IT p2), '남소리 차장'(활동일지), '강새별'(일일보고),
        '조아라 선임 / 정하람 실장'(주간계획), '김온새 책임'(Slack).
      caution: "직급 없이 나오는 실명은 못 잡는다."
    - id: NE-DENY-LIST
      description: 실측에서 확인한 실명을 명시적으로 마스킹한다.
      basis: "재현율을 보장하는 유일한 방법이지만 목록 밖 이름은 못 잡는다. 임시 방편이다."
      # 도메인 프로필마다 자기 조직의 실명 목록으로 바꿔 쓴다. 여기는 합성 예시.
      values_internal:
        [
          홍길동,
          김철수,
          이영희,
          박민수,
          김가온,
          이나래,
          박두리,
          최마루,
          정바다,
          한새봄,
        ]
      values_external: [외부인사, 남소리, 강새별, 조아라, 정하람, 김온새]
      note: >-
        사내 인물명(홍길동·김가온 등)은 문서 작성자·검토자 메타데이터에도 있다. 마스킹하면 Source.origin 이 사라진다.
        → Source 메타데이터의 작성자는 마스킹하지 않고 sensitivity=internal 로만 처리하고,
        Evidence.snippet 본문에 등장하는 실명은 마스킹한다. 두 경로를 분리해야 한다.
    - id: NE-PSEUDONYM-PASS
      description: 명백한 가명은 마스킹하지 않는다.
      values: [박추심, 최추심, 최순이, 홍길동, 이민수]
      basis: "AI QA 대화 예제 로우데이터 화자명 54종은 전부 가명이다('박추심'·'최추심' 등 업무명 결합형)."
      needs_human_confirm: true

# --------------------------------------------------------------------------
# 4. 마스킹 표기법
# --------------------------------------------------------------------------
masking_notation:
  style: fixed_placeholder
  rule: "탐지된 구간 전체를 고정 자리표시자로 치환한다. 원본 자릿수를 유추할 수 있는 부분 마스킹은 쓰지 않는다."
  placeholders:
    mobile: "010-****-****"
    landline: "0*-****-****"
    service_number: "1***-****"
    email: "***@***.***"
    rrn: "######-*******"
    account_no: "***-***-*****"
    biz_no: "***-**-*****"
    person_name: "[이름]"
    person_role: "[담당자]"
  self_check:
    description: 마스킹 결과가 어떤 detector 정규식에도 다시 매칭되지 않아야 한다.
    verify: "각 placeholder 를 전 detector 정규식에 넣어 매칭 0건인지 단위 테스트로 고정한다."
    known_result: >-
      '010-****-****' 는 PII-MOBILE 정규식(\\d{3,4} 요구)에 매칭되지 않는다.
      '######-*******' 는 PII-RRN 정규식에 매칭되지 않는다. → Gate 1A 항목 5 충족.

# --------------------------------------------------------------------------
# 5. Gate 1A 검증 대상
# --------------------------------------------------------------------------
gate_1a_check:
  requirement: "답변·evidence·subgraph 어디에도 전화번호 정규식 매칭 0건"
  detectors_used: [PII-MOBILE, PII-LANDLINE, PII-SERVICE-NUMBER]
  primary_target: "data/sources/slack/*.jsonl 4개 (마스킹 전 원본, 전화 271건)"
  secondary_targets:
