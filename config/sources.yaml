# 1A Source 등록 목록 (A4 Source 등록 CLI 입력값)
#
# Gate 1A 항목 1 이 요구하는 Source 6종을 전부 커버한다:
#   featuremap · sales_xlsx · bd_registry · documents · slack · repo_seed
# 여기에 pain_registry 1종을 추가했다(아래 source_groups.additional 의 사유 참조).
#
# 등록 규칙 (REVISED §4 ①)
#   visibility·sensitivity·pii_flag·source_type 은 필수 입력이고 deny-by-default 다.
#   path 는 반드시 **원본 파일**을 가리킨다(추출 txt 가 아니다 — provenance 오염 방지).
#   예외는 이미지 PDF 3건뿐이며 extractor: vision + transcript_path 로 명시한다.
#
# source_of_record_for 는 §4 ⑥ (2) VERIFIED 판정의 근거다. 값의 정의는 contracts/source_type.enum.json 참조.
#
# 범위 (DECISIONS A-10, 2026-08-08)
#   의뢰 원문은 "`data/sources/wiki` 의 모든 문서, Slack 4채널, auroraworks 레포 자체
#   (특히 docs·portal)" 였다. 초판이 골든 기여도·중복·파싱 노이즈를 이유로 15개를 뺐던 것을 되돌려
#   wiki 31개 파일 전부를 넣는다. 중복·노이즈는 제외 사유가 아니라 dedup 과 발췌 품질로 다룬다.
#   PII 미검증 자료는 빼는 대신 sensitivity=restricted 로 넣어 데모 응답에서 필터한다.
#   파일 수가 많은 레포 문서는 아래 `source_bundles` 에 glob 으로 등록한다(전개 규칙은
#   ingestion/source_registry.py). 번들이 훑은 경로가 `sources` 에 이미 있으면 개별 등록이 이긴다.

version: "1.1.0"
base_dirs:
  wiki: data/sources/wiki
  repo: data/sources/product-repo
  bwm: .

source_groups:
  required_6:
    - featuremap
    - sales_xlsx
    - bd_registry
    - documents
    - slack
    - repo_seed
  additional:
    - id: pain_registry
      reason: >-
        REVISED §4 의 파서 6종 목록에는 없지만, `고객사 Pain Point·구축 대응 통합 관리.xlsx` 는
        need-taxonomy·capability-taxonomy 의 유일한 실물 근거(95행 Pain 원문 + 대응 불가 12건)이고
        GQ-D3·GQ-D4 의 직접 근거다. 빼면 Need canonical 항목 20개 중 대부분이 근거를 잃는다.
        파서는 새로 만들지 않고 A2-c 의 flat-table xlsx 파서를 재사용한다(병합 0개, 헤더 r1 한 줄).
      needs_human_confirm: true
      confirm_reason: "Gate 1A 문구가 'Source 6종'이라 7종이 되는 것이 게이트 판정에 영향을 주는지 사람이 확인해야 한다."

sources:
  # ======================================================================
  # 1. featuremap — 제품 기능의 정본
  # ======================================================================
  - id: src_featuremap_v21
    source_group: featuremap
    path: data/sources/wiki/오로라웍스 기능맵 v2.1.xlsx
    format: xlsx
    source_type: release_spec
    visibility: internal
    sensitivity: internal
    pii_flag: false
    extractor: deterministic
    parser: A2-a xlsx_featuremap
    scope:
      sheets_include: [v2.1, 문서정보]
      sheets_exclude: [표지, v2.0, v1.0]
      exclude_reason: >-
        표지는 0x0 빈 시트다. v2.0·v1.0 은 v2.1 의 버전 컬럼이 이미 이력을 담고 있고,
        기능명 리네이밍 때문에 시트 집합 비교가 57~69% 밖에 안 맞아 오히려 틀린 결론을 만든다.
        (v2.1 에서 2.0.0=O 인 기능 352개 중 v2.0 시트에 실재하는 것은 201개뿐)
      data_rows: 470
      unique_feature_names: 393
    source_of_record_for: 제품 기능의 존재·이름·화면 소속·LiveTalk/GroupTalk 지원 여부·도입 버전(introduced_in)
    origin: "홍길동 (전략사업본부 검토), 최종작성일 2026-08-05"
    doc_status: approved
    parser_notes:
      - "헤더는 r3 한 줄(v2.0/v1.0 과 달리 2줄 헤더가 아니다). 데이터 r4~r519."
      - "세로 병합 ffill 대상은 B(화면)·C(영역)·D(상세분류) 세 개뿐. E·F·G~M 은 ffill 금지."
      - "G·H 체크 표기가 2벌: 'V'(로마자) 와 '√'(U+221A). 하나로 정규화."
      - "미포함 표시도 2벌: '.'(점) 과 빈칸."
      - "기능명 없이 설명만 있는 행 16개는 직전 Feature 에 병합한다(별도 노드로 만들면 이름 없는 노드 16개)."
      - "introduced_in = I~L 중 왼쪽부터 처음 'O' 가 나오는 컬럼."
    golden_link: [GQ-D8, GQ-D5]

  # ======================================================================
  # 2. sales_xlsx — 딜 사실의 정본
  # ======================================================================
  - id: src_sales_activity_log
    source_group: sales_xlsx
    path: data/sources/wiki/영업본부_방문 및 접촉 활동 일지.xlsx
    format: xlsx
    source_type: sales_activity_log
    visibility: restricted
    sensitivity: restricted
    pii_flag: true
    extractor: deterministic
    parser: A2-b xlsx_sales_activity (스키마 4벌 분기)
    scope:
      sheets_include:
        - 홍길동
        - 김철수
        - 이영희
        - 박민수
        - 7월13일~16일
        - 7월6일~10일
        - 일일보고(6월 30일)
        - 일일보고(7월 1일(수))
      sheets_note: >-
        일일보고 14장 중 최신 2장만 넣는다. 인접 시트 셀값이 68~91% 동일한 누적 스냅샷이라
        전부 넣으면 같은 딜(가나손해보험 2.85억 등)이 14번 반복된다.
      sheets_exclude: []
      forecast_note: >-
        매출전망 시트도 넣는다(A-10). 축이 딜이 아니라 회사 매출 집계라 서브파서가 따로 읽는다.
        금액은 자릿수 구분을 넣어 적는다 — 8자리 이상 연속 숫자가 전화번호 정규식에 걸려
        마스킹 게이트를 빨간불로 만들기 때문이다(실측 4건).
      data_rows: "사람별 118 + 날짜별 70 + 일일보고 섹션 5·6 + 매출전망 22"
    source_of_record_for: 딜 단계·예상매출·성공확률·현재 이슈·Next Action·지원 필요 사항 + 접촉 이벤트
    doc_status: approved
    pii_locations:
      - "7월6일~10일!I (연락처) 43셀"
      - "7월13일~16일!I (연락처) 15셀"
      - "일일보고 9개 시트!H (6.전략BD 연락처) 12셀"
      - "7월*!H(고객사 담당자)·일일보고!G(담당자) — 실명+직급, 정규식 미대상"
    parser_notes:
      - "⚠️ 21시트 중 19시트가 hidden 이다. sheet_state != 'visible' 을 건너뛰면 핵심 데이터를 전부 잃는다. GQ-D1 근거가 hidden 시트 안에만 있다."
      - "한 파일 = 한 스키마가 아니다. 사람별 / 날짜별 / 일일보고 / 매출전망 4벌."
      - "사람별 헤더는 r7 한 줄(r7:r8 세로 병합이라 2줄처럼 보이지만 r8 은 전부 공백). 데이터 r9~."
      - "사람별 ffill 대상 = C(영업대표)·D(업권)·F(고객사). 날짜별 ffill = B(일자)·C(담당자)·D(고객사)."
      - "일일보고 5번 섹션 Next Action 컬럼이 시트마다 M/N 으로 이동한다. 섹션 헤더 행에서 컬럼 위치를 매번 다시 읽는다."
      - "7월1일(수) 시트는 5·6 섹션 헤더만 있고 데이터 0행이다."
      - "복붙 dedup: 값 변화 시점만 Observation 으로 남긴다."
      - "날짜에 문자열 이상값 3건('-' 2건, '2026. 05 28' 1건). Excel serial 정수는 전 파일 0건."
      - "'타켓고객'(오타) 21회, 예상매출 단위 미통일 — 원문 보존 필수."
    golden_link: [GQ-D1, GQ-D3]

  - id: src_sales_weekly_plan
    source_group: sales_xlsx
    path: data/sources/wiki/영업본부_주간활동계획.xlsx
    format: xlsx
    source_type: sales_weekly_plan
    visibility: restricted
    sensitivity: restricted
    pii_flag: true
    extractor: deterministic
    parser: A2-b xlsx_weekly_plan
    scope:
      sheets_include: [홍길동, 김철수, 이영희]
      sheets_exclude: [박민수]
      exclude_reason: "hidden 2블록, 68행, 전화번호 0건, 5.·6. 표가 거의 비어 있다."
      blocks: 최신 1개 주차 블록만
      blocks_reason: "사람당 최대 11블록이 반복이다. 전체를 넣으면 같은 고객사가 10회 이상 중복된다."
      tables_include:
        [
          "5. 사업실행협의 이상 고객사",
          "6. 핵심관리 고객사 리스트 및 제안전략(TOP5)",
        ]
    source_of_record_for: 주차 단위 영업 계획과 핵심관리 고객사 목록(고객사·업무도메인·금액·현재 단계)
    doc_status: approved
    pii_locations:
      [
        "H열(연락처) 27셀 — 홍길동 14 · 김철수 8 · 이영희 5",
        "G열(고객사 담당자) 실명+직급",
      ]
    parser_notes:
      - "⚠️ 날짜 표 헤더가 7종 변형이다. 같은 G열이 어떤 주차에서는 '중요도', 다른 주차에서는 '고객사 담당자'다. 컬럼 위치 상수화 금지."
      - "블록 앵커 '금주주간활동(<이름>)' 이 B열과 C열을 오간다. B열만 스캔하면 11블록 중 2개만 잡힌다(실측)."
      - "가로 병합이 다수(B201:E201, L347:Q347). 방향 구분 없이 ffill 하면 서술 텍스트가 옆 컬럼으로 번진다."
      - "5.·6. 표만 헤더 변형이 없어 안정적이다."
      - "'사업기회 발굴'/'사업기회발굴'/'기회발굴' 3벌, '방문미팅'/'방문 미팅' 2벌 — 정규화 없이 집계하면 틀린다."

  # ======================================================================
  # 3. bd_registry — BusinessDomain 의 정본
  # ======================================================================
  - id: src_bd_overview
    source_group: bd_registry
    path: data/sources/wiki/BD Overview.xlsx
    format: xlsx
    source_type: bd_registry
    visibility: internal
    sensitivity: internal
    pii_flag: false
    extractor: deterministic
    parser: A2-c xlsx_bd_registry
    scope:
      sheets_include:
        [BM 정의, 시장사이즈, 진척도, 기대효과, 전략매출, Guest통제, 멀티BM]
      sheets_note: 7시트 전부 소화한다(A2 AC).
    source_of_record_for: BusinessDomain 의 산업 구분·타겟기업·BR/Guest·업무·성숙도 5축·채널 유형·Guest 통제·bd_status·파트너
    doc_status: approved
    parser_notes:
      - "BM 정의: 헤더 r2, 데이터 r3~r19. ffill 대상 B(산업)·C(BD)·D(타겟기업). F열은 '<->' 기호 전용이라 무시."
      - "퇴직연금(C7:C9)·신용평가(C12:C13)는 BR/Guest/업무가 다중행이다."
      - "시장사이즈: B열에 헤더 라벨이 없다(빈 셀). 시장 사이즈 값은 '80억 ~ 100억\\n(4억 기준)' 형태 문자열이며 숫자가 아니다."
      - "진척도: 값 enum ✔ / 제외 / 공백. 범례 r20·r21 이 같은 '✔' 에 '완료'와 '보완필요' 두 라벨을 달아 값만으로 구분 불가(색상 구분 추정, data_only 로는 미확인)."
      - "기대효과: ⚠️ 가로 3블록(B=관리 BM / I=후보 BM / P=제외 BM). 단순 행 순회로는 후보·제외 BM 을 못 읽는다. bd_status 의 정본이 이 시트다."
      - "전략매출·Guest통제·멀티BM: 표가 아니라 B열·C열의 문장 2~3줄이다. 콜론 뒤 쉼표 분리 파싱이 필요하다."
      - "각주 r20(시장사이즈)·r25(진척도)·r21(기대효과)가 신·구 명칭 2벌 문제의 근거 원문이다. 반드시 Evidence 로 보존한다."
      - "날짜 0셀 · PII 0건."
    seed_output: config/bd-seed.yaml
    golden_link: [GQ-D2, GQ-D3, GQ-D5]

  # ======================================================================
  # 4. pain_registry — Need/Capability taxonomy 의 유일한 실물 근거
  # ======================================================================
  - id: src_pain_registry
    source_group: pain_registry
    path: data/sources/wiki/고객사 Pain Point·구축 대응 통합 관리.xlsx
    format: xlsx
    source_type: pain_registry
    visibility: internal
    sensitivity: internal
    pii_flag: false
    extractor: deterministic
    parser: A2-c xlsx_flat_table (재사용)
    scope:
      sheets_include:
        [
          Pain Point 목록,
          대응 불가·제약,
          오픈 후 운영 불편,
          대응 시나리오,
          구축 체크포인트,
          요약,
        ]
      sheets_note: >-
        6시트 전부(A-10). 초판은 요약·대응 시나리오·구축 체크포인트를 뺐으나, 대응 시나리오 7건과
        구축 체크포인트 21건은 "고객 요구가 오면 무엇을 근거로 어떻게 대응하는가"의 유일한 기록이고
        Pain Point 목록 행 번호를 직접 인용해 Evidence 링크로 이어진다.
      data_rows: "95 + 12 + 12 + 7 + 21 + 요약 블록"
    source_of_record_for: 구축 고객 4사의 도입 전 Pain 원문·대응 기능·제공구분, 명시적 기능 부재 12건과 그 사유, 그리고 고객 요구 유형별 대응 순서와 구축 단계 체크 항목
    doc_status: approved
    parser_notes:
      - "병합 0개 — 8종 xlsx 중 유일하게 ffill 이 전혀 필요 없다. 헤더는 전부 r1 한 줄."
      - "고객사 enum 4종: 마바손해보험 34 · 사아캐피탈 31 · 카파전선 15 · 타하렌터카 15 = 95."
      - "분류 enum 10종이 need-taxonomy 의 1차 골격 후보다."
      - "제공구분에 '+' 결합 복합값 2종이 있다('제품개발 + 커스텀', '제품기본 + 커스텀'). 구축 체크포인트 시트는 '제품기본·커스텀 2종으로만 구분해 합의'라고 적어 시트 간 정의가 어긋난다(conflict 후보)."
      - "'대응 불가·제약'의 발생 고객사는 '·' 결합 복합값('카파전선·마바손해보험'). 분해 필요."
      - "'오픈 후 운영 불편' 출처 열이 'Pain Point 목록 75번 연계' 처럼 다른 시트 행 번호를 직접 인용한다. Evidence 링크에 그대로 쓸 수 있다."
      - "날짜 0셀 · PII 0건 · 복붙 블록 없음."
    seed_output: [config/need-taxonomy.yaml, config/capability-taxonomy.yaml]
    golden_link: [GQ-D3, GQ-D4]

  # ======================================================================
  # 5. documents — 제안서·Open Book·내부 자료 12종
  # ======================================================================
  - id: src_doc_haneul_it_memo
    source_group: documents
    path: data/sources/wiki/하늘IT 협업 관련 검토 사항.pdf
    format: pdf
    source_type: internal_memo
    visibility: restricted
    sensitivity: restricted
    pii_flag: false
    pii_note: "정규식 매칭 0건이지만 p2 에 실명 '홍길동님' 이 있다. 그래서 restricted 다."
    extractor: deterministic
    parser: A2-d doc_pdf (pdftotext -layout)
    locator_marker: "=== [PAGE n] ==="
    pages: 4
    chars: 2450
    source_of_record_for: 하늘IT 협업의 현재 진행 상태·의사결정 안건·미해결 전제(멀티테넌트 개발 필요, 수익 배분 미정, AWS 비용 공동 지불 미협의)
    priority: 1
