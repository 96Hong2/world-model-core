# 전개 규칙은 ingestion/source_registry.py 가 정본이다.
#   id      = <id_prefix>_<root 기준 상대경로 slug>
#   충돌    = 위 `sources` 에 같은 path 가 이미 있으면 개별 등록이 이기고 번들 쪽은 버린다
#   override= 경로 규칙에 걸리면 그 항목만 값을 덮어쓴다(민감 자료를 restricted 로 올리는 통로)
